<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSCQ Floating Browser - Google Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --google-bg: #202124;
            --google-card: #303134;
            --google-border: #5f6368;
            --google-blue: #8ab4f8;
            --google-text: #e8eaed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--google-bg);
            color: var(--google-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* TOMBOL BOLA FLOATING UTAMA */
        .floating-bubble-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99999;
            touch-action: none;
            cursor: pointer;
        }

        .floating-bubble {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #303134, #171717);
            border: 2px solid var(--google-border);
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--google-blue);
            font-size: 22px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            user-select: none;
        }
        .floating-bubble:hover { border-color: var(--google-blue); transform: scale(1.05); }
        .floating-bubble:active { transform: scale(0.92); }

        /* JENDELA BROWSER MENGAMBANG (FLOATING WINDOW) */
        .floating-browser-window {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%; max-width: 420px;
            height: 65vh;
            background: var(--google-bg);
            border: 1px solid var(--google-border);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            z-index: 99998;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
            animation: fadeInWindow 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInWindow {
            from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* HEADER / DRAG BAR */
        .browser-header {
            background: #171717;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3c4043;
            cursor: move;
            cursor: grab;
        }
        .browser-header:active { cursor: grabbing; }
        
        .browser-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--google-text);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
        }
        .browser-title i { color: var(--google-blue); }

        .browser-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .browser-header-actions i {
            cursor: pointer;
            color: #9aa0a6;
            font-size: 14px;
            padding: 4px;
            transition: 0.2s;
        }
        .browser-header-actions i:hover { color: #fff; }

        /* ADDRESS BAR GOOGLE STYLE */
        .browser-address-bar {
            display: flex;
            align-items: center;
            background: #171717;
            padding: 8px 12px;
            gap: 8px;
            border-bottom: 1px solid #3c4043;
        }

        .browser-address-bar input {
            flex: 1;
            padding: 8px 12px;
            background: var(--google-card);
            border: 1px solid var(--google-border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--google-text);
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .browser-address-bar input:focus { border-color: var(--google-blue); }

        .browser-address-bar button {
            padding: 8px 14px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .browser-address-bar button:hover { background: #3367d6; }

        /* BODY / IFRAME CONTAINER */
        .browser-body {
            flex: 1;
            width: 100%;
            background: #000;
            position: relative;
            touch-action: auto;
        }

        .browser-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* PANDUAN AWAL DI HALAMAN UTAMA */
        .demo-card {
            background: var(--google-card);
            border: 1px solid var(--google-border);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .demo-card h2 { font-size: 16px; margin-bottom: 8px; color: var(--google-blue); }
        .demo-card p { font-size: 13px; color: #9aa0a6; line-height: 1.5; margin-bottom: 16px; }
        .demo-btn {
            background: #4285f4; color: white; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- KONTEN UTAMA HALAMAN -->
    <div class="demo-card">
        <h2>HSCQ Floating Browser</h2>
        <p>Klik tombol bola mengambang di pojok kanan bawah atau tombol di bawah untuk membuka jendela browser Google mengambang.</p>
        <button class="demo-btn" onclick="toggleFloatingBrowser()">Buka Floating Browser</button>
    </div>

    <!-- BOLA BUBBLE MENGAMBANG (DRAGGABLE) -->
    <div class="floating-bubble-container" id="bubbleContainer" onclick="toggleFloatingBrowser()">
        <div class="floating-bubble" title="Buka Floating Browser">
            <i class="fa-solid fa-compass"></i>
        </div>
    </div>

    <!-- JENDELA BROWSER MENGAMBANG -->
    <div class="floating-browser-window" id="floatingBrowserWindow">
        <div class="browser-header" id="browserHeader">
            <div class="browser-title">
                <i class="fa-solid fa-globe"></i> HSCQ // FLOATING BROWSER
            </div>
            <div class="browser-header-actions">
                <i class="fa-solid fa-rotate-right" title="Refresh" onclick="reloadBrowser()"></i>
                <i class="fa-solid fa-minus" title="Minimize / Close" onclick="toggleFloatingBrowser()"></i>
            </div>
        </div>
        <div class="browser-address-bar">
            <input type="text" id="browserAddressInput" placeholder="Telusuri Google atau masukkan URL..." onkeypress="handleAddressKey(event)">
            <button onclick="loadAddress()">GO</button>
        </div>
        <div class="browser-body">
            <iframe id="browserIframe" src="https://www.google.com/webhp?igu=1" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </div>
    </div>

    <script>
        const browserWindow = document.getElementById('floatingBrowserWindow');
        const bubbleContainer = document.getElementById('bubbleContainer');
        const addressInput = document.getElementById('browserAddressInput');
        const iframe = document.getElementById('browserIframe');

        function toggleFloatingBrowser() {
            if (browserWindow.style.display === 'flex') {
                browserWindow.style.display = 'none';
            } else {
                browserWindow.style.display = 'flex';
                resetWindowPosition();
            }
        }

        function resetWindowPosition() {
            browserWindow.style.transform = 'translate(-50%, -50%)';
            browserWindow.dataset.translateX = 0;
            browserWindow.dataset.translateY = 0;
        }

        function loadAddress() {
            let val = addressInput.value.trim();
            if (val) {
                let url = val;
                let ytRegExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                let ytMatch = url.match(ytRegExp);
                if (ytMatch && ytMatch[2].length === 11) {
                    url = `https://www.youtube.com/embed/${ytMatch[2]}`;
                } else if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    if (url.includes('.') && !url.includes(' ')) {
                        url = 'https://' + url;
                    } else {
                        url = `https://www.google.com/search?igu=1&q=${encodeURIComponent(val)}`;
                    }
                }
                iframe.src = url;
            }
        }

        function handleAddressKey(e) {
            if (e.key === 'Enter') loadAddress();
        }

        function reloadBrowser() {
            iframe.src = iframe.src;
        }

        // --- DRAGGABLE JENDELA BROWSER ---
        const header = document.getElementById('browserHeader');
        let isDraggingWin = false;
        let startXWin = 0, startYWin = 0;
        let winRaf = null;

        browserWindow.dataset.translateX = 0;
        browserWindow.dataset.translateY = 0;

        header.addEventListener('mousedown', winDragStart);
        header.addEventListener('touchstart', winDragStart, {passive: true});

        function winDragStart(e) {
            if (e.target.tagName === 'I' || e.target.closest('i')) return;
            isDraggingWin = true;
            startXWin = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            startYWin = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

            document.addEventListener('mousemove', winDrag);
            document.addEventListener('touchmove', winDrag, {passive: false});
            document.addEventListener('mouseup', winDragEnd);
            document.addEventListener('touchend', winDragEnd);
        }

        function winDrag(e) {
            if (!isDraggingWin) return;
            if (e.cancelable) e.preventDefault();

            let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - startXWin;
            let deltaY = clientY - startYWin;

            startXWin = clientX;
            startYWin = clientY;

            let tx = parseFloat(browserWindow.dataset.translateX) + deltaX;
            let ty = parseFloat(browserWindow.dataset.translateY) + deltaY;

            browserWindow.dataset.translateX = tx;
            browserWindow.dataset.translateY = ty;

            if (!winRaf) {
                winRaf = requestAnimationFrame(() => {
                    browserWindow.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
                    winRaf = null;
                });
            }
        }

        function winDragEnd() {
            isDraggingWin = false;
            document.removeEventListener('mousemove', winDrag);
            document.removeEventListener('touchmove', winDrag);
            document.removeEventListener('mouseup', winDragEnd);
            document.removeEventListener('touchend', winDragEnd);
        }

        // --- DRAGGABLE BOLA BUBBLE MENGAMBANG ---
        let isDraggingBubble = false;
        let startXBubble = 0, startYBubble = 0;
        let currentXBubble = 0, currentYBubble = 0;
        let bubbleRaf = null;

        bubbleContainer.addEventListener('mousedown', bubbleDragStart);
        bubbleContainer.addEventListener('touchstart', bubbleDragStart, {passive: true});

        function bubbleDragStart(e) {
            isDraggingBubble = true;
            startXBubble = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            startYBubble = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

            document.addEventListener('mousemove', bubbleDrag);
            document.addEventListener('touchmove', bubbleDrag, {passive: false});
            document.addEventListener('mouseup', bubbleDragEnd);
            document.addEventListener('touchend', bubbleDragEnd);
        }

        function bubbleDrag(e) {
            if (!isDraggingBubble) return;
            if (e.cancelable) e.preventDefault();

            let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - startXBubble;
            let deltaY = clientY - startYBubble;

            startXBubble = clientX;
            startYBubble = clientY;

            currentXBubble += deltaX;
            currentYBubble += deltaY;

            if (!bubbleRaf) {
                bubbleRaf = requestAnimationFrame(() => {
                    bubbleContainer.style.transform = `translate3d(${currentXBubble}px, ${currentYBubble}px, 0)`;
                    bubbleRaf = null;
                });
            }
        }

        function bubbleDragEnd(e) {
            isDraggingBubble = false;
            document.removeEventListener('mousemove', bubbleDrag);
            document.removeEventListener('touchmove', bubbleDrag);
            document.removeEventListener('mouseup', bubbleDragEnd);
            document.removeEventListener('touchend', bubbleDragEnd);
        }
    </script>
</body>
</html>
